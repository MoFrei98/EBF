# Xcode-Projekt für die iOS-App, erzeugt mit XcodeGen:  cd ios && xcodegen
name: EBF
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: NO

packages:
  EBFCore:
    path: EBFCore

targets:
  EBF:
    type: application
    platform: iOS
    sources:
      - path: EBF
      # Dieselben Umblätter-Geräusche wie in der Android-App.
      - path: ../app/src/main/res/raw
        buildPhase: resources
        group: Sounds
    dependencies:
      - package: EBFCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ebf
        PRODUCT_NAME: EBF
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: EBF/Info.plist
    info:
      path: EBF/Info.plist
      properties:
        CFBundleDevelopmentRegion: de
        CFBundleDisplayName: EBF
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Der Bibliotheksordner erscheint in der Dateien-App unter "Auf meinem iPhone › EBF".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # "Öffnen mit" / Teilen für PDFs
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
