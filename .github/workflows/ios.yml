name: iOS

# Baut und testet die iOS-App. Der plattformunabhängige Kern läuft zuerst auf Linux (günstig);
# nur wenn er grün ist, startet der macOS-Runner für App, Simulator-Screenshots und .ipa.
on:
  push:
    branches: [main, ios-port]
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  core:
    name: Kern (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Tests
        run: swift test --package-path ios/EBFCore
